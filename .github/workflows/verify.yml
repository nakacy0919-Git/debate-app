name: Verify Debate Battle
on:
  push:
    branches:
      - fix/security-learning-review-20261117
  pull_request:

permissions:
  contents: read

jobs:
  curriculum-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Production uses prebuilt static assets. Keep production dependencies gated.
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      # GHSA-fc5q-39xc-vjpf currently has no patched upstream release.
      # Keep its full-tree advisory visible without blocking lesson validation.
      - name: Full dependency audit (reports unresolved dev-tool advisories)
        run: npm audit --audit-level=high
        continue-on-error: true
