name: Verify Debate Battle
on:
  push:
    branches:
      - fix/security-learning-review-20261117
  pull_request:

permissions:
  contents: read

jobs:
  curriculum-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
