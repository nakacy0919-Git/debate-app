name: Verify Debate Battle
on:
  push:
    branches:
      - fix/security-learning-review-20261117
  pull_request:

permissions:
  contents: read

jobs:
  curriculum-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Production uses prebuilt static assets. Keep production dependencies gated.
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      # Fail on any new advisory or production exposure. A temporary exception
      # is limited to GHSA-fc5q-39xc-vjpf in dev-only dependencies, expiring
      # 2026-12-18. This does not claim the upstream risk is fixed.
      - name: Full dependency audit with explicit temporary exception
        run: node scripts/security-audit.mjs
